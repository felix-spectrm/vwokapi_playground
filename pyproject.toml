[project]
name = "vwokapi-playground"
version = "0.1.0"
description = "CLI client for the VWOK API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "vwok-cli",
]

[tool.uv.workspace]
members = [
    "packages/vwok-client",
    "cmd/vwok-cli",
]

[tool.uv.sources]
vwok-cli = { workspace = true }
